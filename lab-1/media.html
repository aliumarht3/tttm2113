<!DOCTYPE html>
<html>
<head>
  <title>My Favorite Pictures</title>
  <style>
    #header {
      background-color: navy;
      padding: 20px;
      text-align: center;
      font-family: 'Noto Sans Mono', monospace;
    }
    #title {
      color: white;
      margin: 0;
    }
    #menu {
      background-color: lightgray;
    }
    #iframe {
      width: 100%;
      height: 40px;
      border: none;
    }
    #content {
      padding: 20px;
      min-height: 550px;
      font-family: 'Noto Sans Mono', monospace;
      max-width: 1100px; 
      margin: 0 auto;
      font-size: 20px;
    }
    #footer {
      background-color: lightgray;
      height: 50px;
      line-height: 50px;
      text-align: center;
      font-family: 'Noto Sans Mono', monospace;
    }
    #footnote {
      font-weight: bold;
    }
  </style>
</head>
<body>
 
<div id="header">
  <h1 id="title">My Favorite Pictures</h1>
</div>
 
<div id="menu">
  <iframe id="iframe" src="menu.html" title="Menu"></iframe>
</div>
 
<div id="content">
  <table id="tblpictures" border="1" width="100%" cellpadding="20" cellspacing="5" style="table-layout: fixed;">
    <tr>
      <th colspan="2">Pictures</th><!-- This cell should span -->
    </tr>
    <tr>
      <th>Static</th>
      <th>Animated</th>
    </tr>
    <tr>
      <td align="center">
        <img src="https://i.postimg.cc/G3PCZ2xc/ef72dbe7-b3cf-4211-a5a1-c172bb05bc99.jpg" style="max-width: 80%;">
      </td>
      <td align="center">
        <img src="https://media1.tenor.com/m/Uf5sO6eeaEAAAAAd/spurs-europa-league.gif" style="max-height: 100%; aspect-ratio: 11/16; object-fit: cover;">
      </td>
    </tr>
    <tr>
      <th>Music</th>
      <th>Video</th>
    </tr>
    <tr>
      <td align="center">
        <audio controls>
          <source src="https://upload.wikimedia.org/wikipedia/commons/4/41/Arabian_Epic_music.opus?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" type="audio/mpeg">
        Your browser does not support the audio element.
        </audio>
      </td>
      <td align="center">
        <!-- https://www.youtube.com/watch?v=M4i2vnnLNxg-->
        <iframe width="100%" height="400px" src="https://www.youtube.com/embed/M4i2vnnLNxg"></iframe>
      </td>
    </tr>
  </table>
</div>
 
<div id="footer">
  <span id="footnote">Web Programming @ UKM</span>
  <img src="https://www.ukm.my/portal/wp-content/uploads/2026/07/UKMLogo-Eemblem.png" style="height: 50%; vertical-align: middle;">
</div>
 
</body>
</html>
